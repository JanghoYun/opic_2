<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>질문은행 · OPIc AL</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <header class="site-nav"><div class="inner"><a class="brand" href="./index.html">OPIc<span>AL</span></a><nav aria-label="주요 메뉴"><a href="./index.html" aria-current="page">질문은행</a><a href="./mock-exam.html">모의고사</a><a href="./question-guide.html">가이드</a></nav></div></header>
    <main class="container">
        <h1>질문은행</h1>
        <p class="page-lead">질문을 듣고 먼저 소리 내어 답한 뒤, AL 예시답변과 비교하세요. 56문항 · 15개 주제</p>
        <div class="practice-options"><label for="sourceFilter">문항 범위<select id="sourceFilter"><option value="all">전체 56문항</option><option value="original">기존 28문항</option><option value="predicted">새 예상 연습 28문항</option></select></label><label for="topicFilter">주제<select id="topicFilter"><option value="전체">전체 주제</option><option>자기소개</option><option>집에서의 휴가</option><option>은행</option><option>음악</option><option>해외여행</option><option>롤플레이</option><option>지리</option><option>캠핑</option><option>공원</option><option>커피숍</option><option>집</option><option>날씨</option><option>교통</option><option>재활용</option><option>스마트폰</option></select></label><label for="voiceSpeed">음성 속도<select id="voiceSpeed"><option value="0.75">천천히 · 0.75배</option><option value="0.9">조금 천천히 · 0.9배</option><option value="1" selected>실제 속도 · 1배</option><option value="1.1">조금 빠르게 · 1.1배</option></select></label></div>
        <p id="questionMeta" role="status">범위를 고르고 시작을 누르세요.</p>
        <div class="question-box">
            <button type="button" id="speakButton" class="speak-button hidden">🔊 질문 듣기</button>
            <p id="question" class="question-text">시작하려면 '시작' 버튼을 누르세요.</p>
        </div>
        <div class="progress-bar" aria-hidden="true"><span id="progressFill"></span></div>
        <p id="progress" class="progress-text"></p>
        <div class="navigation-buttons">
            <button id="startButton" class="button primary">시작</button>
            <button id="prevButton" class="button hidden">이전</button>
            <button id="nextButton" class="button primary hidden">다음 질문</button>
        </div>
        <button id="showAnswerButton" class="button hidden">AL 예시답변 보기</button>
        <h2>다른 연습</h2>
        <div class="quick-links">
            <a href="./mock-exam.html">15문항 모의고사<span>실전처럼 듣고 녹음하기 · 다시 듣기 1회</span></a>
            <a href="./question-guide.html">AL 가이드<span>AL 전략, 문항별 녹음과 섀도잉</span></a>
        </div>
    </main>

    <div id="answerModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="answerTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="answerTitle" class="modal-title">AL 예시답변</h2>
                <button type="button" class="modal-speak-button" onclick="speakAnswer()">▶ 답변 듣기</button>
                <button type="button" class="modal-close-button" onclick="closeModal()" aria-label="닫기">×</button>
            </div>
            <p id="answerText" class="modal-text" lang="en"></p>
            <p id="tipText" class="modal-text"></p>
        </div>
    </div>

    <!-- 번역 툴팁 -->
    <div id="translationTooltip" class="translation-tooltip"></div>

    <script src="data.js"></script>
    <script src="voice.js"></script>
    <script>
        // 오픽 질문과 답변 데이터를 주제별로 그룹화
        const topicGroups = [...new Set(QUESTIONS.map(x => x.topic))].map(topic => ({ topic, questions: QUESTIONS.filter(x => x.topic === topic) }));

        // Fisher-Yates shuffle algorithm
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let shuffledQuestions = [];
        let currentQuestionIndex = -1;

        const questionElement = document.getElementById('question');
        const progressElement = document.getElementById('progress');
        const startButton = document.getElementById('startButton');
        const nextButton = document.getElementById('nextButton');
        const prevButton = document.getElementById('prevButton');
        const showAnswerButton = document.getElementById('showAnswerButton');
        const speakButton = document.getElementById('speakButton');
        const answerModal = document.getElementById('answerModal');
        const answerTextElement = document.getElementById('answerText');
        const translationTooltip = document.getElementById('translationTooltip');

        // 상태 업데이트
        function updateUI() {
            if (currentQuestionIndex < shuffledQuestions.length) {
                if (currentQuestionIndex === -1) {
                    questionElement.textContent = "시작하려면 '시작' 버튼을 누르세요.";
                    progressElement.textContent = "";
                    document.getElementById('progressFill').style.width = '0';
                    prevButton.classList.add('hidden');
                    nextButton.classList.add('hidden');
                    showAnswerButton.classList.add('hidden');
                    speakButton.classList.add('hidden');
                    startButton.classList.remove('hidden');
                } else {
                    questionElement.textContent = shuffledQuestions[currentQuestionIndex].q;
                    const item=shuffledQuestions[currentQuestionIndex];
                    document.querySelector('#questionMeta').textContent=item.topic+' · '+(item.source==='predicted'?'새 예상 연습 · '+item.type:'기존 문항');
                    progressElement.textContent = `${currentQuestionIndex + 1} / ${shuffledQuestions.length}`;
                    document.getElementById('progressFill').style.width = ((currentQuestionIndex + 1) / shuffledQuestions.length * 100) + '%';
                    startButton.classList.add('hidden');
                    nextButton.classList.remove('hidden');
                    showAnswerButton.classList.remove('hidden');
                    speakButton.classList.remove('hidden');
                    prevButton.classList.toggle('hidden', currentQuestionIndex === 0);
                }
            } else {
                questionElement.textContent = "모든 질문을 마쳤습니다. 다시 시작하려면 '다시 시작' 버튼을 누르세요.";
                progressElement.textContent = "";
                nextButton.classList.add('hidden');
                prevButton.classList.add('hidden');
                showAnswerButton.classList.add('hidden');
                speakButton.classList.add('hidden');
                startButton.classList.remove('hidden');
                startButton.textContent = "다시 시작";
            }
        }

        // 질문 음성으로 읽어주기
        function speakQuestion() {
            const item = shuffledQuestions[currentQuestionIndex];
            if (item) OpicVoice.play(item.id, 'q', { rate: Number(document.getElementById('voiceSpeed').value) });
        }

        // 답변 팝업 열기
        function showAnswer() {
            if (currentQuestionIndex >= 0 && currentQuestionIndex < shuffledQuestions.length) {
                if ('speechSynthesis' in window) {
                    OpicVoice.stop();
                }
                answerTextElement.textContent = shuffledQuestions[currentQuestionIndex].a;
                const cur = shuffledQuestions[currentQuestionIndex];
                document.getElementById('tipText').textContent = '전개: ' + cur.flow + '\n\nAL 포인트: ' + cur.tip;
                answerModal.classList.remove('hidden');
            }
        }

        // 답변 팝업 닫기
        function closeModal() {
            if ('speechSynthesis' in window) {
                OpicVoice.stop();
            }
            answerModal.classList.add('hidden');
        }

        // 답변 음성으로 읽어주기
        function speakAnswer() {
            const item = shuffledQuestions[currentQuestionIndex];
            if (item) OpicVoice.play(item.id, 'a', { rate: Number(document.getElementById('voiceSpeed').value) });
        }

        // 다음 질문으로 이동
        function nextQuestion() {
            if ('speechSynthesis' in window) {
                OpicVoice.stop();
            }
            currentQuestionIndex++;
            updateUI();
        }

        // 이전 질문으로 이동
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                if ('speechSynthesis' in window) {
                    OpicVoice.stop();
                }
                currentQuestionIndex--;
                updateUI();
            }
        }

        // 시작 버튼 클릭 이벤트 (모의고사 시작 및 질문 셔플)
        startButton.addEventListener('click', () => {
            const source = document.querySelector('#sourceFilter').value;
            const topic = document.querySelector('#topicFilter').value;
            const selected = topicGroups.filter(g => topic === '전체' || g.topic === topic).map(g => ({...g, questions:g.questions.filter(q => source === 'all' || q.source === source)})).filter(g=>g.questions.length);
            if (!selected.length) { questionElement.textContent='이 범위에는 문항이 없어요. 범위나 주제를 바꿔주세요.'; return; }
            shuffleArray(selected); shuffledQuestions = [];
            selected.forEach(group => { shuffleArray(group.questions); shuffledQuestions = shuffledQuestions.concat(group.questions); });
            currentQuestionIndex = 0;
            updateUI();
            document.getElementById('questionMeta').scrollIntoView({ behavior: 'smooth', block: 'start' });
            startButton.textContent = "시작";
        });

        ['sourceFilter','topicFilter'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{if('speechSynthesis' in window)OpicVoice.stop();closeModal();currentQuestionIndex=-1;shuffledQuestions=[];startButton.textContent='시작';document.querySelector('#questionMeta').textContent='선택한 범위로 연습을 시작하세요.';updateUI();}));
        answerModal.addEventListener('click', e => { if (e.target === answerModal) closeModal(); });
        // 다음 질문 버튼 클릭 이벤트
        nextButton.addEventListener('click', nextQuestion);

        // 이전 질문 버튼 클릭 이벤트
        prevButton.addEventListener('click', prevQuestion);

        // 답변 보기 버튼 클릭 이벤트
        showAnswerButton.addEventListener('click', showAnswer);

        // 음성 재생 버튼 클릭 이벤트
        speakButton.addEventListener('click', speakQuestion);

        // 창이 닫힐 때 음성 중지
        window.addEventListener('beforeunload', () => {
            if ('speechSynthesis' in window) {
                OpicVoice.stop();
            }
        });

        // 페이지가 숨겨질 때도 음성 중지 (탭 전환 등)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && 'speechSynthesis' in window) {
                OpicVoice.stop();
            }
        });

        // 영어 단어 번역 기능
        async function translateWord(text) {
            try {
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=${encodeURIComponent(text)}`);
                const data = await response.json();
                return data[0][0][0];
            } catch (error) {
                return '번역 실패';
            }
        }

        // 선택된 텍스트 번역
        function handleTextSelection() {
            const selection = window.getSelection();
            if (selection.toString().trim()) {
                const selectedText = selection.toString().trim();
                
                if (selectedText.length > 0 && /[a-zA-Z]/.test(selectedText)) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    
                    translateWord(selectedText).then(translation => {
                        translationTooltip.textContent = `${selectedText} → ${translation}`;
                        translationTooltip.style.left = `${rect.left + window.scrollX}px`;
                        translationTooltip.style.top = `${rect.bottom + window.scrollY + 10}px`;
                        translationTooltip.classList.add('show');
                    });
                }
            }
        }

        // 마우스 업 이벤트로 텍스트 선택 감지
        document.addEventListener('mouseup', handleTextSelection);

        // 클릭 시 툴팁 숨기기
        document.addEventListener('click', () => {
            translationTooltip.classList.remove('show');
        });

        // ESC 키로 툴팁 숨기기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!answerModal.classList.contains('hidden')) closeModal();
                translationTooltip.classList.remove('show');
            }
        });

    </script>
</body>
</html>
