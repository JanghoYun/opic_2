<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPIc 모의고사</title>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            flex-direction: column;
        }
        .container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        .question-box {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9fafb;
            border-radius: 0.75rem;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #e5e7eb;
            text-align: left;
            position: relative;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1f2937;
            line-height: 1.75rem;
        }
        .navigation-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        .button {
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 0.75rem;
            transition: background-color 0.2s, transform 0.2s;
            cursor: pointer;
            border: none;
            color: white;
            background-color: #3b82f6;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .button:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
        }
        .button:active {
            transform: translateY(0);
        }
        .progress-text {
            color: #4b5563;
            font-weight: 500;
            margin-top: 1rem;
        }
        .speak-button {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.2s;
        }
        .speak-button:hover {
            color: #1f2937;
        }
        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            max-width: 600px;
            width: 90%;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: left;
            overflow-y: auto;
            max-height: 80vh;
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #1f2937;
        }
        .modal-text {
            font-size: 1rem;
            line-height: 1.5rem;
            color: #4b5563;
            white-space: pre-wrap;
        }
        .modal-close-button {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #9ca3af;
            cursor: pointer;
        }
        .modal-speak-button {
            position: absolute;
            top: 1rem;
            right: 3rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.2s;
        }
        .modal-speak-button:hover {
            color: #1f2937;
        }
        
        .translation-tooltip {
            position: absolute;
            background-color: #1f2937;
            color: white;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            z-index: 1001;
            max-width: 300px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .translation-tooltip.show {
            opacity: 1;
        }
    body{margin:0}.hidden{display:none!important}.text-3xl{font-size:1.875rem}.font-bold{font-weight:700}.mb-6{margin-bottom:1.5rem}.mt-4{margin-top:1rem}.text-gray-800{color:#1f2937}*{box-sizing:border-box}.practice-options{display:flex;gap:12px;flex-wrap:wrap;text-align:left;margin:20px 0}.practice-options label{flex:1;min-width:160px;font-size:14px}.practice-options select{display:block;width:100%;padding:10px;margin-top:5px;border:1px solid #d1d5db;border-radius:6px;font:inherit}a{color:#2563eb}.practice-note{font-size:14px;color:#4b5563;line-height:1.7}.question-box{padding-top:3.5rem}#questionMeta{font-size:13px;color:#4b5563;margin:16px 0}.modal-content{max-height:85vh;overflow:auto}.question-text{overflow-wrap:anywhere}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #2563eb;outline-offset:3px}@media(max-width:600px){body{padding:14px}.container{padding:20px}.navigation-buttons{gap:8px;flex-wrap:wrap}.button{padding:12px 16px}.question-box{padding:48px 16px 20px}.modal-content{width:calc(100% - 28px);padding:24px}.question-text{font-size:18px;line-height:1.65}}
</style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">OPIc 모의고사</h1><p class="practice-note">기존 28문항 + 새 예상 연습 28문항 · 15개 주제<br>모든 예시답변은 AL 목표(150~200단어, 약 1분 30초~2분)에 맞춰 새로 썼습니다. 공식 기출이 아닌 연습 자료입니다.</p><p><a href="./question-guide.html">질문·예시답변 가이드와 시험 조사 보기</a></p><p><a href="./mock-exam.html">15문항 랜덤 모의고사 · 내 답변 녹음</a></p><div class="practice-options"><label for="sourceFilter">문항 범위<select id="sourceFilter"><option value="all">전체 56문항</option><option value="original">기존 28문항</option><option value="predicted">새 예상 연습 28문항</option></select></label><label for="topicFilter">주제<select id="topicFilter"><option value="전체">전체 주제</option><option>자기소개</option><option>집에서의 휴가</option><option>은행</option><option>음악</option><option>해외여행</option><option>롤플레이</option><option>지리</option><option>캠핑</option><option>공원</option><option>커피숍</option><option>집</option><option>날씨</option><option>교통</option><option>재활용</option><option>스마트폰</option></select></label></div><p id="questionMeta" role="status">선택한 범위로 연습을 시작하세요.</p>
        <div class="question-box">
            <span id="speakButton" class="speak-button hidden">🔊</span>
            <p id="question" class="question-text">시작하려면 '시작' 버튼을 누르세요.</p>
        </div>
        <div class="navigation-buttons">
            <button id="startButton" class="button">시작</button>
            <button id="prevButton" class="button hidden">뒤로가기</button>
            <button id="nextButton" class="button hidden">다음 질문</button>
        </div>
        <button id="showAnswerButton" class="button hidden mt-4">답변 보기</button>
        <p id="progress" class="progress-text"></p>
    </div>

    <!-- The Modal for the Answer -->
    <div id="answerModal" class="modal hidden">
        <div class="modal-content">
            <span class="modal-close-button" onclick="closeModal()">&times;</span>
            <span class="modal-speak-button" onclick="speakAnswer()">&#129047;</span>
            <h2 class="modal-title">AL 예시답변</h2>
            <p id="answerText" class="modal-text"></p>
            <p id="tipText" class="modal-text" style="margin-top:1rem;padding:1rem;background:#eff6ff;border-radius:.5rem"></p>
        </div>
    </div>

    <!-- 번역 툴팁 -->
    <div id="translationTooltip" class="translation-tooltip"></div>

    <script src="data.js"></script>
    <script>
        // 오픽 질문과 답변 데이터를 주제별로 그룹화
        const topicGroups = [...new Set(QUESTIONS.map(x => x.topic))].map(topic => ({ topic, questions: QUESTIONS.filter(x => x.topic === topic) }));

        // Fisher-Yates shuffle algorithm
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let shuffledQuestions = [];
        let currentQuestionIndex = -1;

        const questionElement = document.getElementById('question');
        const progressElement = document.getElementById('progress');
        const startButton = document.getElementById('startButton');
        const nextButton = document.getElementById('nextButton');
        const prevButton = document.getElementById('prevButton');
        const showAnswerButton = document.getElementById('showAnswerButton');
        const speakButton = document.getElementById('speakButton');
        const answerModal = document.getElementById('answerModal');
        const answerTextElement = document.getElementById('answerText');
        const translationTooltip = document.getElementById('translationTooltip');

        // 상태 업데이트
        function updateUI() {
            if (currentQuestionIndex < shuffledQuestions.length) {
                if (currentQuestionIndex === -1) {
                    questionElement.textContent = "시작하려면 '시작' 버튼을 누르세요.";
                    progressElement.textContent = "";
                    prevButton.classList.add('hidden');
                    nextButton.classList.add('hidden');
                    showAnswerButton.classList.add('hidden');
                    speakButton.classList.add('hidden');
                    startButton.classList.remove('hidden');
                } else {
                    questionElement.textContent = shuffledQuestions[currentQuestionIndex].q;
                    const item=shuffledQuestions[currentQuestionIndex];
                    document.querySelector('#questionMeta').textContent=item.topic+' · '+(item.source==='predicted'?'새 예상 연습 · '+item.type:'기존 문항');
                    progressElement.textContent = `${currentQuestionIndex + 1} / ${shuffledQuestions.length}`;
                    startButton.classList.add('hidden');
                    nextButton.classList.remove('hidden');
                    showAnswerButton.classList.remove('hidden');
                    speakButton.classList.remove('hidden');
                    prevButton.classList.toggle('hidden', currentQuestionIndex === 0);
                }
            } else {
                questionElement.textContent = "모든 질문을 마쳤습니다. 다시 시작하려면 '다시 시작' 버튼을 누르세요.";
                progressElement.textContent = "";
                nextButton.classList.add('hidden');
                prevButton.classList.add('hidden');
                showAnswerButton.classList.add('hidden');
                speakButton.classList.add('hidden');
                startButton.classList.remove('hidden');
                startButton.textContent = "다시 시작";
            }
        }

        // 질문 음성으로 읽어주기
        function speakQuestion() {
            if (shuffledQuestions[currentQuestionIndex] && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(shuffledQuestions[currentQuestionIndex].q);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // 답변 팝업 열기
        function showAnswer() {
            if (currentQuestionIndex >= 0 && currentQuestionIndex < shuffledQuestions.length) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                answerTextElement.textContent = shuffledQuestions[currentQuestionIndex].a;
                const cur = shuffledQuestions[currentQuestionIndex];
                document.getElementById('tipText').textContent = '전개: ' + cur.flow + '\n\nAL 포인트: ' + cur.tip;
                answerModal.classList.remove('hidden');
            }
        }

        // 답변 팝업 닫기
        function closeModal() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            answerModal.classList.add('hidden');
        }

        // 답변 음성으로 읽어주기
        function speakAnswer() {
            if (answerTextElement.textContent && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(answerTextElement.textContent);
                utterance.lang = 'en-US'; // 영어로 설정
                utterance.rate = 0.8; // 음성 속도를 0.8배로 설정 (기본값 1.0)
                window.speechSynthesis.speak(utterance);
            }
        }

        // 다음 질문으로 이동
        function nextQuestion() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            currentQuestionIndex++;
            updateUI();
        }

        // 이전 질문으로 이동
        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                currentQuestionIndex--;
                updateUI();
            }
        }

        // 시작 버튼 클릭 이벤트 (모의고사 시작 및 질문 셔플)
        startButton.addEventListener('click', () => {
            const source = document.querySelector('#sourceFilter').value;
            const topic = document.querySelector('#topicFilter').value;
            const selected = topicGroups.filter(g => topic === '전체' || g.topic === topic).map(g => ({...g, questions:g.questions.filter(q => source === 'all' || q.source === source)})).filter(g=>g.questions.length);
            if (!selected.length) { questionElement.textContent='이 범위에는 문항이 없어요. 범위나 주제를 바꿔주세요.'; return; }
            shuffleArray(selected); shuffledQuestions = [];
            selected.forEach(group => { shuffleArray(group.questions); shuffledQuestions = shuffledQuestions.concat(group.questions); });
            currentQuestionIndex = 0;
            updateUI();
            startButton.textContent = "시작";
        });

        ['sourceFilter','topicFilter'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{if('speechSynthesis' in window)window.speechSynthesis.cancel();closeModal();currentQuestionIndex=-1;shuffledQuestions=[];startButton.textContent='시작';document.querySelector('#questionMeta').textContent='선택한 범위로 연습을 시작하세요.';updateUI();}));
        // 다음 질문 버튼 클릭 이벤트
        nextButton.addEventListener('click', nextQuestion);

        // 이전 질문 버튼 클릭 이벤트
        prevButton.addEventListener('click', prevQuestion);

        // 답변 보기 버튼 클릭 이벤트
        showAnswerButton.addEventListener('click', showAnswer);

        // 음성 재생 버튼 클릭 이벤트
        speakButton.addEventListener('click', speakQuestion);

        // 창이 닫힐 때 음성 중지
        window.addEventListener('beforeunload', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        // 페이지가 숨겨질 때도 음성 중지 (탭 전환 등)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        });

        // 영어 단어 번역 기능
        async function translateWord(text) {
            try {
                const response = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=${encodeURIComponent(text)}`);
                const data = await response.json();
                return data[0][0][0];
            } catch (error) {
                return '번역 실패';
            }
        }

        // 선택된 텍스트 번역
        function handleTextSelection() {
            const selection = window.getSelection();
            if (selection.toString().trim()) {
                const selectedText = selection.toString().trim();
                
                if (selectedText.length > 0 && /[a-zA-Z]/.test(selectedText)) {
                    const range = selection.getRangeAt(0);
                    const rect = range.getBoundingClientRect();
                    
                    translateWord(selectedText).then(translation => {
                        translationTooltip.textContent = `${selectedText} → ${translation}`;
                        translationTooltip.style.left = `${rect.left + window.scrollX}px`;
                        translationTooltip.style.top = `${rect.bottom + window.scrollY + 10}px`;
                        translationTooltip.classList.add('show');
                    });
                }
            }
        }

        // 마우스 업 이벤트로 텍스트 선택 감지
        document.addEventListener('mouseup', handleTextSelection);

        // 클릭 시 툴팁 숨기기
        document.addEventListener('click', () => {
            translationTooltip.classList.remove('show');
        });

        // ESC 키로 툴팁 숨기기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                translationTooltip.classList.remove('show');
            }
        });

    </script>
</body>
</html>
